<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <meta property="og:title" content="대리기사 — 모두의 고민을 대신해서 들어주기" />
    <meta

      content="모두의 고민을 대신해서 들어주고 목적지까지 함께 가 주는 마음 운행 웹앱"

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --font-serif: "Gowun Batang", Georgia, serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

        --bg-page: #F0F5FA;
        --bg-subtle: #E4EEF7;
        --bg-card: #FFFFFF;
        --border: #CBDCEB;
        --accent: #2B5B84;
        --accent-hover: #224869;
        --accent-soft: #DCE8F4;
        --accent-text: #1F4463;
        --text-primary: #162433;
        --text-secondary: #43566B;
        --gauge-track: #DCE8F4;
        --lamp-glow: #F6DEB3;

        --drive-lane-duration: 4.5s;
        --drive-lamps-duration: 20s;
        --drive-horizon-duration: 52.5s;
        --drive-light-duration: 27.5s;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        font-size: 16px;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        color: var(--text-primary);
        background-color: var(--bg-page);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .font-diary {
        font-family: var(--font-serif);
      }

      .font-gauge {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .break-keep {
        word-break: keep-all;
      }

      .text-balance {
        text-wrap: balance;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* App shell & atmospheric background */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        background-color: var(--bg-page);
        background-image: radial-gradient(
          ellipse 85% 42% at 50% 0%,
          var(--bg-subtle) 0%,
          transparent 72%
        );
        color: var(--text-primary);
        transition:
          background-color 700ms cubic-bezier(0.16, 1, 0.3, 1),
          color 400ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .theme-transition {
        transition:
          background-color 700ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 500ms cubic-bezier(0.16, 1, 0.3, 1),
          color 400ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Header */
      .site-header {
        position: relative;
        z-index: 20;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .header-inner {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .header-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .brand-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        border: 0;
        background: transparent;
        padding: 0.25rem;
        margin: -0.25rem;
        border-radius: 0.75rem;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .brand-btn:hover {
        opacity: 0.85;
      }

      .brand-icon-box {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 0.75rem;
        background-color: var(--accent);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .brand-title {
        font-family: var(--font-serif);
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text-primary);
      }

      .font-scale-group {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background-color: var(--bg-subtle);
        flex-shrink: 0;
      }

      .font-scale-btn {
        min-height: 34px;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.25rem 0.625rem;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        background: transparent;
        color: var(--text-secondary);
        transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease;
      }

      .font-scale-btn[aria-pressed="true"] {
        background: #ffffff;
        color: var(--accent-text);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      /* Stepper */
      .route-nav {
        width: 100%;
        overflow-x: auto;
      }

      .route-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.25rem;
        min-width: max-content;
      }

      .route-item {
        display: flex;
        align-items: center;
      }

      .route-step-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 40px;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.375rem 0.625rem;
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        color: var(--text-secondary);
        font-size: 0.8125rem;
        font-weight: 500;
        transition: opacity 160ms ease, background-color 160ms ease;
      }

      .route-step-btn:hover:not(:disabled) {
        background: rgba(0, 0, 0, 0.04);
      }

      .route-step-btn:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .route-step-btn.is-current {
        color: var(--text-primary);
        font-weight: 700;
      }

      .route-step-btn.is-done {
        color: var(--accent-text);
        font-weight: 600;
      }

      .route-badge {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .route-step-btn.is-current .route-badge {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .route-step-btn.is-done .route-badge {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-text);
      }

      .route-connector {
        width: 1rem;
        height: 1px;
        background: var(--border);
        margin: 0 0.125rem;
        flex-shrink: 0;
      }

      .route-connector.is-done {
        background: var(--accent);
      }

      .route-divider {
        display: none;
        width: 1px;
        height: 1rem;
        background: var(--border);
        margin: 0 0.375rem;
        flex-shrink: 0;
      }

      .route-label-desktop {
        display: none;
      }

      .route-label-mobile {
        display: inline;
      }

      @media (min-width: 640px) {
        .header-inner {
          padding: 0.75rem 1.5rem;
        }
        .route-step-btn {
          font-size: 0.875rem;
        }
        .route-connector {
          width: 1.5rem;
          margin: 0 0.25rem;
        }
        .route-label-desktop {
          display: inline;
        }
        .route-label-mobile {
          display: none;
        }
      }

      @media (min-width: 1024px) {
        .header-inner {
          padding: 0.75rem 2rem;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 1.5rem;
        }
        .header-top-row {
          display: contents;
        }
        .brand-btn {
          order: 1;
        }
        .route-nav {
          order: 2;
          width: auto;
        }
        .font-scale-group {
          order: 3;
        }
        .route-divider {
          display: block;
        }
      }

      /* Main & Footer */
      .site-main {
        position: relative;
        z-index: 10;
        flex: 1;
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.75rem 1rem 3rem;
      }

      @media (min-width: 640px) {
        .site-main {
          padding: 2.25rem 1.5rem 3.5rem;
        }
      }

      @media (min-width: 1024px) {
        .site-main {
          padding: 2.5rem 2rem 4rem;
        }
      }

      .site-footer {
        position: relative;
        z-index: 20;
        border-top: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .footer-inner {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
      }

      .footer-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .footer-inner {
          padding: 1rem 1.5rem;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      @media (min-width: 1024px) {
        .footer-inner {
          padding: 1rem 2rem;
        }
      }

      /* Shared Surfaces & Buttons */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.045);
      }

      .card-frosted {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 44px;
        border-radius: 0.75rem;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-primary);
        transition: background-color 160ms ease, border-color 160ms ease, opacity 160ms ease, transform 160ms ease;
      }

      .btn:hover:not(:disabled) {
        background: rgba(15, 23, 42, 0.035);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn-lg {
        min-height: 48px;
        border-radius: 1rem;
        padding: 0.75rem 1.75rem;
        font-size: 1rem;
      }

      .btn-sm {
        min-height: 36px;
        border-radius: 0.625rem;
        padding: 0.375rem 0.75rem;
        font-size: 0.75rem;
      }

      .divider-top {
        border-top: 1px solid var(--border);
      }

      /* Boarding Grid */
      .boarding-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
        align-items: start;
      }

      @media (min-width: 1024px) {
        .boarding-grid {
          grid-template-columns: 5fr 7fr;
        }
      }

      .aside-stack {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .pad-card {
        padding: 1.5rem;
      }

      @media (min-width: 640px) {
        .pad-card {
          padding: 1.75rem;
        }
      }

      .pad-form {
        padding: 1.5rem;
      }

      @media (min-width: 640px) {
        .pad-form {
          padding: 2rem;
        }
      }

      .avatar-lg {
        width: 5rem;
        height: 5rem;
        border-radius: 1rem;
        object-fit: cover;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .avatar-md {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.875rem;
        object-fit: cover;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .avatar-sm {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
        object-fit: cover;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .avatar-fallback {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-soft);
        color: var(--accent-text);
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .sample-list {
        margin-top: 1rem;
      }

      .sample-btn {
        width: calc(100% + 1.25rem);
        margin: 0 -0.625rem;
        padding: 0.75rem 0.625rem;
        min-height: 48px;
        border: 0;
        border-top: 1px solid var(--border);
        border-radius: 0.75rem;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        text-align: left;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      .sample-btn:first-child {
        border-top: 0;
      }

      .sample-btn:hover {
        background: rgba(15, 23, 42, 0.03);
      }

      .sample-title {
        margin: 0.2rem 0 0;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sample-action {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--accent-text);
        white-space: nowrap;
        flex-shrink: 0;
        transition: transform 150ms ease;
      }

      .sample-btn:hover .sample-action {
        transform: translateX(2px);
      }

      /* Form sections */
      .form-stack {
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }

      .fieldset-clean {
        border: 0;
        padding: 0;
        margin: 0;
      }

      .section-legend {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
      }

      .helper-text {
        font-size: 0.75rem;
        line-height: 1.6;
        color: var(--text-secondary);
        margin: 0.5rem 0 0;
      }

      .drivers-grid {
        margin-top: 0.75rem;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .drivers-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .driver-card-btn {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        padding: 0.875rem;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: #ffffff;
        text-align: left;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease;
      }

      .driver-card-btn:hover {
        background: rgba(15, 23, 42, 0.02);
      }

      .driver-card-btn[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .category-wrap {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
      }

      .category-btn {
        min-height: 44px;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-primary);
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
      }

      .category-btn:hover {
        background: rgba(15, 23, 42, 0.025);
      }

      .category-btn[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
        font-weight: 600;
      }

      .emotion-grid {
        margin-top: 0.75rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.625rem;
      }

      @media (min-width: 640px) {
        .emotion-grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      .emotion-btn {
        min-height: 48px;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-primary);
        padding: 0.625rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
      }

      .emotion-dot {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 9999px;
        border: 1px solid #ffffff;
        flex-shrink: 0;
      }

      /* Slider */
      input[type="range"].gauge-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        outline: none;
        cursor: pointer;
      }

      input[type="range"].gauge-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
        transition: transform 150ms ease;
      }

      input[type="range"].gauge-slider::-webkit-slider-thumb:hover {
        transform: scale(1.08);
      }

      input[type="range"].gauge-slider::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
        transition: transform 150ms ease;
      }

      .text-input-area {
        width: 100%;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--bg-page);
        color: var(--text-primary);
        padding: 1rem;
        font-size: 1rem;
        line-height: 1.65;
        resize: vertical;
        transition: border-color 200ms ease, background-color 300ms ease;
      }

      .text-input-area.has-error {
        border-color: #DC2626;
      }

      .error-text {
        margin: 0.375rem 0 0;
        font-size: 0.875rem;
        font-weight: 600;
        color: #B91C1C;
      }

      /* Gauge */
      .gauge-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .gauge-svg-sm {
        width: 11rem;
      }

      .gauge-svg-md {
        width: 13rem;
      }

      @media (min-width: 640px) {
        .gauge-svg-sm {
          width: 12rem;
        }
        .gauge-svg-md {
          width: 15rem;
        }
      }

      .gauge-needle-group {
        transition: transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .gauge-arc-fill {
        transition: stroke-dashoffset 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Dashboard Grid */
      .dash-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      @media (min-width: 768px) {
        .dash-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .dash-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
      }

      @media (min-width: 640px) {
        .dash-card {
          padding: 1.75rem;
        }
      }

      .emotion-tiles {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.625rem;
      }

      .emotion-tile {
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: var(--bg-subtle);
        padding: 0.625rem 0.5rem;
        text-align: center;
      }

      .values-balance-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.625rem;
        align-items: stretch;
      }

      @media (min-width: 640px) {
        .values-balance-grid {
          grid-template-columns: 1fr auto 1fr;
        }
      }

      .value-tile {
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--bg-subtle);
        padding: 1rem;
      }

      .vs-badge-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.125rem 0.25rem;
      }

      .vs-badge {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-secondary);
        font-size: 0.6875rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Warning Light Cluster */
      .warning-cluster {
        border-radius: 1rem;
        border: 1px solid rgba(51, 65, 85, 0.8);
        background: #161E29;
        padding: 0.875rem 1rem;
        color: #F1F5F9;
      }

      .warning-cluster-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        border-bottom: 1px solid rgba(51, 65, 85, 0.7);
        padding-bottom: 0.625rem;
      }

      .warning-cluster-grid {
        margin-top: 0.75rem;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.375rem;
      }

      .warning-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        padding: 0.5rem 0.25rem;
      }

      /* Driving Screen & Road Backdrop */
      .driving-backdrop {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        user-select: none;
        background: linear-gradient(180deg, var(--bg-page) 0%, var(--bg-subtle) 58%, var(--accent-soft) 100%);
      }

      .subtle-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.28) transparent;
      }

      .subtle-scroll::-webkit-scrollbar {
        width: 6px;
      }

      .subtle-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .subtle-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(100, 116, 139, 0.25);
        border-radius: 9999px;
      }

      @keyframes driving-light-drift-a {
        0% { transform: translate3d(-8%, -4%, 0) scale(1); opacity: 0.45; }
        50% { transform: translate3d(8%, 4%, 0) scale(1.08); opacity: 0.72; }
        100% { transform: translate3d(-8%, -4%, 0) scale(1); opacity: 0.45; }
      }

      @keyframes driving-light-drift-b {
        0% { transform: translate3d(10%, 3%, 0) scale(1.04); opacity: 0.35; }
        50% { transform: translate3d(-10%, -5%, 0) scale(0.96); opacity: 0.62; }
        100% { transform: translate3d(10%, 3%, 0) scale(1.04); opacity: 0.35; }
      }

      @keyframes driving-horizon-scroll {
        0% { transform: translate3d(0%, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }

      @keyframes driving-lane-scroll {
        0% { transform: translate3d(0, -50%, 0); }
        100% { transform: translate3d(0, 0%, 0); }
      }

      @keyframes driving-cabin-glint {
        0% { transform: translate3d(-35%, 0, 0); opacity: 0; }
        25% { opacity: 0.55; }
        75% { opacity: 0.45; }
        100% { transform: translate3d(115%, 0, 0); opacity: 0; }
      }

      .driving-anim-light-a {
        animation: driving-light-drift-a var(--drive-light-duration, 22s) ease-in-out infinite;
        will-change: transform, opacity;
      }

      .driving-anim-light-b {
        animation: driving-light-drift-b calc(var(--drive-light-duration, 22s) * 1.25) ease-in-out infinite;
        will-change: transform, opacity;
      }

      .driving-anim-horizon {
        animation: driving-horizon-scroll var(--drive-horizon-duration, 42s) linear infinite;
        will-change: transform;
      }

      .driving-anim-lamps {
        animation: driving-horizon-scroll var(--drive-lamps-duration, 16s) linear infinite;
        will-change: transform;
      }

      .driving-anim-lane {
        animation: driving-lane-scroll var(--drive-lane-duration, 3.6s) linear infinite;
        will-change: transform;
      }

      .driving-anim-glint {
        animation: driving-cabin-glint calc(var(--drive-lamps-duration, 16s) * 0.75) ease-in-out infinite;
        will-change: transform, opacity;
      }

      .driving-workspace {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        align-items: start;
      }

      @media (min-width: 1024px) {
        .driving-workspace {
          grid-template-columns: 8fr 4fr;
        }
      }

      .modes-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      @media (min-width: 640px) {
        .modes-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .mode-btn {
        min-height: 44px;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-primary);
        padding: 0.5rem 0.875rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        text-align: left;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
      }

      .mode-btn[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent-text);
      }

      .chat-scroll {
        position: relative;
        z-index: 10;
        padding: 1.25rem;
        min-height: 280px;
        max-height: 440px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      @media (min-width: 640px) {
        .chat-scroll {
          padding: 1.5rem;
        }
      }

      .bubble-driver {
        border-radius: 1rem;
        border-top-left-radius: 0.25rem;
        border: 1px solid var(--border);
        background: var(--bg-subtle);
        color: var(--text-primary);
        padding: 0.75rem 1rem;
        font-size: 0.9375rem;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: keep-all;
      }

      .bubble-user {
        max-width: 82%;
        border-radius: 1rem;
        border-top-right-radius: 0.25rem;
        background: var(--accent);
        color: #ffffff;
        padding: 0.75rem 1rem;
        font-size: 0.9375rem;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: keep-all;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .spin-icon {
        animation: spin 1s linear infinite;
      }

      /* Arrival & Safety */
      .arrival-metrics {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      @media (min-width: 640px) {
        .arrival-metrics {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .metric-tile {
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: var(--bg-subtle);
        padding: 1rem;
      }

      .helpline-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .helpline-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      /* Drawer & CheerPopup */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        justify-content: flex-end;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(2px);
      }

      .drawer-panel {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 28rem;
        height: 100%;
        background: #ffffff;
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 30px rgba(15, 23, 42, 0.12);
        display: flex;
        flex-direction: column;
      }

      .cheer-popup {
        position: fixed;
        top: 1rem;
        left: 1rem;
        right: 1rem;
        z-index: 60;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 1rem;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      }

      @media (min-width: 640px) {
        .cheer-popup {
          top: auto;
          bottom: 1.5rem;
          left: auto;
          right: 1.5rem;
          width: 360px;
        }
        .cheer-popup.avoid-right {
          right: auto;
          left: 1.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-transition,
        .gauge-needle-group,
        .gauge-arc-fill {
          transition: none !important;
        }
        .driving-anim-light-a,
        .driving-anim-light-b,
        .driving-anim-horizon,
        .driving-anim-lamps,
        .driving-anim-lane,
        .driving-anim-glint,
        .spin-icon {
          animation: none !important;
        }
      }
    </style>
  </head>

          return EMOTION_THEMES[emotion] || EMOTION_THEMES['서운함'];
        }

        function getDrivingModeOption(modeKey) {
          for (var i = 0; i < DRIVING_MODES.length; i++) {
            if (DRIVING_MODES[i].key === modeKey) return DRIVING_MODES[i];
          }
          return DRIVING_MODES[0];
        }

        function formatTimeLabel(date) {
          var d = date || new Date();
          var h = String(d.getHours()).padStart(2, '0');
          var m = String(d.getMinutes()).padStart(2, '0');
          return h + ':' + m;
        }

        function getLocalDateKey(date) {
          var d = date || new Date();
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, '0');
          var day = String(d.getDate()).padStart(2, '0');
          return y + '-' + m + '-' + day;
        }

        function formatKoreanDateLabel(dateKey) {
          var parts = String(dateKey || '').split('-');
          if (parts.length !== 3) return dateKey;
          return Number(parts[1]) + '월 ' + Number(parts[2]) + '일';
        }

        function getIntensityDescriptor(intensity) {
          var clamped = Math.min(10, Math.max(1, Math.round(Number(intensity) || 5)));
          if (clamped <= 3) return '잔잔하게 스치는 정도예요';
          if (clamped <= 6) return '마음 한편에 계속 걸리는 정도예요';
          if (clamped <= 8) return '꽤 무겁게 자리 잡아 숨 고르기가 필요해요';
          return '지금 당장 내려놓고 쉬어야 할 만큼 벅차요';
        }

        function computeGaugeGeometry(intensity, radius, centerX, centerY) {
          radius = radius || 86;
          centerX = centerX || 110;
          centerY = centerY || 104;
          var clampedValue = Math.min(10, Math.max(1, Math.round(Number(intensity) || 5)));
          var ratio = clampedValue / 10;
          var arcLength = Math.PI * radius;
          var dashOffset = arcLength * (1 - ratio);
          var needleAngleDeg = Number((-90 + ratio * 180).toFixed(1));
          var statusLabel = '잔잔한 주행';
          if (clampedValue >= 8) statusLabel = '잠시 멈춤 권장';
          else if (clampedValue >= 5) statusLabel = '주의 깊은 살핌';
          return {
            clampedValue: clampedValue,
            ratio: ratio,
            arcLength: Number(arcLength.toFixed(2)),
            dashOffset: Number(dashOffset.toFixed(2)),
            needleAngleDeg: needleAngleDeg,
            statusLabel: statusLabel,
          };
        }

        function detectSafetySignal(text) {
          var normalized = String(text || '').trim();
          if (!normalized) return { level: 'safe', title: '', guidance: '' };
          var i;
          for (i = 0; i < CRISIS_PATTERNS.length; i++) {
            if (CRISIS_PATTERNS[i].test(normalized)) {
              return {
                level: 'crisis',
                title: '잠시 운행을 멈추고 안전한 도움을 먼저 연결할게요',
                guidance:
                  '지금 혼자 감당하기 어려운 위기 신호가 느껴져 대화를 잠시 멈추었습니다. 대리기사는 전문 상담사나 의료인이 아니므로, 지금 바로 믿을 수 있는 가족·선생님이나 아래 전문 상담 기관에 도움을 요청해 주세요.',
              };
            }
          }
          for (i = 0; i < HARASSMENT_PATTERNS.length; i++) {
            if (HARASSMENT_PATTERNS[i].test(normalized)) {
              return {
                level: 'harassment',
                title: '상대에게 상처를 주는 문장은 대신 만들어 드릴 수 없어요',
                guidance:
                  '대리기사는 욕설이나 협박, 괴롭힘 목적의 표현은 작성하지 않습니다. 대신 지금 왜 그렇게 화가 나고 억울한지, 내 마음을 안전하게 정리하는 방향으로는 함께 이야기할 수 있어요.',
              };
            }
          }
          return { level: 'safe', title: '', guidance: '' };
        }

        function selectWarningLight(blindspot, intensity, emotion) {
          var text = String(blindspot || '').trim();
          var isHighAlert = Number(intensity) >= 8;
          var severityLabel = isHighAlert ? '우선 살핌' : '주의 살핌';
          var matchedId = 'blindspot';
          if (
            emotion === '지침' ||
            /지침|지쳤|피곤|휴식|쉼|여유|에너지|부담|무리|소진|스스로를?\s*돌보/.test(text)
          ) {
            matchedId = 'battery';
          } else if (/말|표현|대화|소통|오해|전달|꺼내|이야기|솔직/.test(text)) {
            matchedId = 'engine';
          } else if (isHighAlert || /감정|상처|화|불안|조급|두려|억울|서운/.test(text)) {
            matchedId = 'master';
          }
          var spec = WARNING_LIGHT_SPECS[matchedId];
          return {
            id: spec.id,
            shortLabel: spec.shortLabel,
            title: spec.title,
            severityLabel: severityLabel,
            isHighAlert: isHighAlert,
          };
        }

        function loadMindDiaryEntries() {
          try {
            var raw = window.localStorage.getItem(MIND_DIARY_STORAGE_KEY);
            if (!raw) return [];
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed
              .filter(function (item) {
                return item && typeof item.dateKey === 'string' && typeof item.oneLine === 'string';
              })
              .sort(function (a, b) {
                return b.dateKey.localeCompare(a.dateKey);
              });
          } catch (e) {
            return memoryDiaryFallback.slice();
          }
        }

        function saveMindDiaryEntries(entries) {
          memoryDiaryFallback = entries.slice();
          try {
            window.localStorage.setItem(MIND_DIARY_STORAGE_KEY, JSON.stringify(entries));
          } catch (e) {
            // Ignore strict file:// or private browsing storage restrictions gracefully
          }
        }

        function upsertMindDiaryEntry(entries, draft) {
          var cleanedLine = String(draft.oneLine || '').trim().slice(0, 140);
          var existing = entries.find(function (item) {
            return item.dateKey === draft.dateKey;
          });
          var nextEntry = {
            id: existing ? existing.id : 'diary-' + draft.dateKey,
            dateKey: draft.dateKey,
            emotion: draft.emotion,
            oneLine: cleanedLine,
            category: draft.category,
            updatedAt: new Date().toISOString(),
          };
          var filtered = entries.filter(function (item) {
            return item.dateKey !== draft.dateKey;
          });
          return [nextEntry].concat(filtered).sort(function (a, b) {
            return b.dateKey.localeCompare(a.dateKey);
          });
        }

        function removeMindDiaryEntry(entries, dateKey) {
          return entries.filter(function (item) {
            return item.dateKey !== dateKey;
          });
        }

        function pickRandomCheerMessage(trigger, previousId) {
          var pool = trigger === 'diary_saved' ? DIARY_SAVED_CHEERS : DRIVE_START_CHEERS;
          var candidates =
            pool.length > 1 && previousId
              ? pool.filter(function (item) {
                  return item.id !== previousId;
                })
              : pool;
          var idx = Math.floor(Math.random() * candidates.length);
          return candidates[idx] || pool[0];
        }

        /* -----------------------------------------------------------------
           Built-in Korean Mind Analyzer & Persona Conversation Engine
           ----------------------------------------------------------------- */
        function summarizeSentenceForCore(rawText, category, emotion) {
          var cleaned = String(rawText || '')
            .replace(/\s+/g, ' ')
            .trim();
          var sentences = cleaned
            .split(/(?<=[.!?])\s+|\n+/)
            .map(function (s) {
              return s.trim();
            })
            .filter(Boolean);
          var target = sentences[0] || cleaned;
          if (target.length > 54) {
            var commaCut = target.slice(0, 54).lastIndexOf(',');
            var spaceCut = target.slice(0, 54).lastIndexOf(' ');
            var cutIdx = commaCut > 24 ? commaCut : spaceCut > 22 ? spaceCut : 52;
            target = target.slice(0, cutIdx).replace(/[,.\s]+$/, '') + '는 고민이 크다';
          } else {
            target = target.replace(/[.!?]+$/, '');
          }
          if (target.length < 6) {
            return category + ' 문제로 ' + emotion + '이(가) 크게 남아 있는 상태예요';
          }
          return target;
        }

        function analyzeConcernLocally(input) {

            } else if (driver.id === 'nightowl') {
              blindspot = '상대의 불편함을 먼저 헤아리느라 정작 내 감정이 보내는 신호는 조용히 덮어 두고 계실 수 있습니다.';

          } else if (/성적|진로|시험|목표|비교|뒤처/.test(text)) {

            } else {

              blindspot = '주변을 따뜻하게 챙기려는 마음이 큰 만큼, 스스로에게도 따뜻한 쉼표를 줄 시간이 꼭 필요해요.';
            } else if (driver.id === 'nightowl') {
              blindspot = '책임을 다하려는 진심이 깊을수록 마음의 배터리가 닳고 있다는 신호를 뒤늦게 알아차리기 쉽습니다.';
            } else if (driver.id === 'coach') {
              blindspot = '모든 상황을 혼자 떠안고 풀려다 보니 정작 내 에너지를 충전할 여백을 놓치고 계실 수 있어요.';
            } else {
              blindspot = '주변 사람들을 잘 이끌고 싶은 책임감이 커서, 지금 스스로도 쉬어 가야 한다는 신호를 놓치고 계셨을지 모릅니다.';

          } else {
            blindspot =
              driver.id === 'coach'
                ? '감정이 크게 올라온 상황일수록 내 입장만큼이나 상대방의 말 못 한 맥락이 비어 있을 수 있어요.'
                : '지금 마음이 무거운 만큼, 혼자 감당하려다 보니 다른 시각이나 나를 아껴 줄 여지를 잠시 놓치고 계실 수 있어요.';

          } else if (/아이들|학생|수업|엄하게/.test(text)) {

          } else if (input.emotion === '지침') {
            values = ['맡은 일에 대한 책임감', '나 자신을 돌보는 쉼'];
          }

          var rawIntensity = Math.min(10, Math.max(1, Math.round(Number(input.intensity) || 5)));

          return {
            emotions: emotions,
            intensity: rawIntensity,
            core: core,
            blindspot: blindspot,

        function createInitialDriverGreeting(input, analysis, mode) {

        function pickCuePhrase(userText) {

        function renderGaugeHtml(intensity, theme, size) {
          var g = computeGaugeGeometry(intensity);
          var radius = 86;
          var cx = 110;
          var cy = 104;
          var startX = cx - radius;
          var endX = cx + radius;
          var arcPath = 'M ' + startX + ' ' + cy + ' A ' + radius + ' ' + radius + ' 0 0 1 ' + endX + ' ' + cy;
          var innerPath = 'M ' + (cx - (radius - 13)) + ' ' + cy + ' A ' + (radius - 13) + ' ' + (radius - 13) + ' 0 0 1 ' + (cx + (radius - 13)) + ' ' + cy;
          var ticks = [];
          for (var i = 0; i < 10; i++) {
            var r = (i + 1) / 10;
            var rad = Math.PI * (1 - r);
            var isMajor = i === 0 || i === 4 || i === 9;
            var outerR = radius + 6;
            var innerR = radius - (isMajor ? 5 : 2);
            var x1 = (cx + innerR * Math.cos(rad)).toFixed(2);
            var y1 = (cy - innerR * Math.sin(rad)).toFixed(2);
            var x2 = (cx + outerR * Math.cos(rad)).toFixed(2);
            var y2 = (cy - outerR * Math.sin(rad)).toFixed(2);
            var stroke = i + 1 <= g.clampedValue ? theme.accent : theme.border;
            ticks.push(
              '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + stroke + '" stroke-width="' + (isMajor ? 2.2 : 1.3) + '" stroke-linecap="round"/>'
            );
          }

          return (
            '<div class="gauge-wrap" data-gauge-root>' +
            '<svg viewBox="0 0 220 126" class="' +
            (size === 'sm' ? 'gauge-svg-sm' : 'gauge-svg-md') +
            '" role="img" aria-label="감정 강도 게이지 10점 만점 중 ' +
            g.clampedValue +
            '점, ' +
            g.statusLabel +
            '">' +
            '<path d="' + arcPath + '" fill="none" stroke="' + theme.gaugeTrack + '" stroke-width="14" stroke-linecap="round"/>' +
            '<path d="' + innerPath + '" fill="none" stroke="' + theme.border + '" stroke-width="1" stroke-dasharray="2.5 5" opacity="0.75"/>' +
            '<path data-gauge-fill d="' + arcPath + '" fill="none" stroke="' + theme.accent + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + g.arcLength + '" stroke-dashoffset="' + g.dashOffset + '" class="gauge-arc-fill"/>' +
            ticks.join('') +
            '<g data-gauge-needle transform="rotate(' + g.needleAngleDeg + ' ' + cx + ' ' + cy + ')" class="gauge-needle-group">' +
            '<polygon points="' + (cx - 3.2) + ',' + (cy - 4) + ' ' + cx + ',' + (cy - (radius - 13)) + ' ' + (cx + 3.2) + ',' + (cy - 4) + '" fill="' + theme.textPrimary + '"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="8" fill="#FFFFFF" stroke="' + theme.accent + '" stroke-width="3"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="2.4" fill="' + theme.textPrimary + '"/>' +
            '</g>' +
            '<text x="24" y="122" text-anchor="middle" fill="' + theme.textSecondary + '" style="font-size:11px;font-family:var(--font-mono)">1</text>' +
            '<text x="196" y="122" text-anchor="middle" fill="' + theme.textSecondary + '" style="font-size:11px;font-family:var(--font-mono)">10</text>' +
            '</svg>' +
            '<div style="margin-top:0.25rem;display:flex;align-items:baseline;gap:0.375rem">' +
            '<span data-gauge-value class="font-gauge" style="font-size:' + (size === 'sm' ? '1.5rem' : '1.875rem') + ';font-weight:700;color:' + theme.textPrimary + '">' + g.clampedValue + '</span>' +
            '<span class="font-gauge" style="font-size:0.875rem;color:' + theme.textSecondary + '">/ 10</span>' +
            '<span aria-hidden="true" style="margin:0 0.25rem;color:' + theme.textSecondary + '">·</span>' +
            '<span data-gauge-status style="font-size:0.875rem;font-weight:600;color:' + theme.accentText + '">' + g.statusLabel + '</span>' +
            '</div>' +
            '</div>'
          );
        }

            '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:0.75rem">' +

            '<div class="footer-actions">' +

            state.diaryEntries.length +
            ')</span>' +
            '</button>' +
            '<span>모두의 고민을 판단 없이 먼저 들어주는 마음 운행</span>' +
            '</div>' +
            '</div>' +
            '</footer>'
          );

        /* =================================================================
           6. Main Render & Event Wiring (IME-safe surgical input handling)
           ================================================================= */
        var appEl = document.getElementById('app');

        function renderApp() {
          applyThemeVars();

          var mainBody = '';
          if (state.safetyBlock) {
            mainBody = renderSafetyHtml();
          } else if (state.stage === 1) {
            mainBody = renderBoardingHtml();
          } else if (state.stage === 2) {
            mainBody = renderDashboardHtml();
          } else if (state.stage === 3) {
            mainBody = renderDrivingHtml();
          } else if (state.stage === 4) {
            mainBody = renderArrivalHtml();
          }

          appEl.innerHTML =
            renderHeaderHtml() +
            '<main class="site-main">' +
            mainBody +
            '</main>' +
            renderFooterHtml() +
            renderDiaryDrawerHtml() +
            renderCheerPopupHtml();

          wireDynamicInputs();
        }

        function wireDynamicInputs() {
          var slider = document.getElementById('intensity-slider');
          if (slider) {
            slider.addEventListener('input', function () {
              var val = Number(slider.value);
              state.input.intensity = val;
              var pct = ((val - 1) / 9) * 100;
              slider.style.background =
                'linear-gradient(to right, var(--accent) 0%, var(--accent) ' +
                pct +
                '%, var(--gauge-track) ' +
                pct +
                '%, var(--gauge-track) 100%)';
              var lbl = document.getElementById('slider-label-val');
              if (lbl) lbl.textContent = val + ' / 10';
              var desc = document.getElementById('slider-descriptor');
              if (desc) desc.textContent = getIntensityDescriptor(val);

              // Update live preview gauge surgically
              var g = computeGaugeGeometry(val);
              var gaugeVal = document.querySelector('[data-gauge-value]');
              if (gaugeVal) gaugeVal.textContent = String(g.clampedValue);
              var gaugeStatus = document.querySelector('[data-gauge-status]');
              if (gaugeStatus) gaugeStatus.textContent = g.statusLabel;
              var fill = document.querySelector('[data-gauge-fill]');
              if (fill) fill.setAttribute('stroke-dashoffset', String(g.dashOffset));
              var needle = document.querySelector('[data-gauge-needle]');
              if (needle) needle.setAttribute('transform', 'rotate(' + g.needleAngleDeg + ' 110 104)');
            });
          }

          var concernArea = document.getElementById('concern-textarea');
          if (concernArea) {
            concernArea.addEventListener('input', function () {
              state.input.concernText = concernArea.value;
              var count = document.getElementById('concern-count');
              if (count) count.textContent = concernArea.value.length + ' / 1,500';
              if (state.validationError) {
                state.validationError = null;
                concernArea.classList.remove('has-error');
                var errEl = document.getElementById('concern-error');
                if (errEl) errEl.remove();
              }
            });
          }

          var boardingForm = document.getElementById('boarding-form');
          if (boardingForm) {
            boardingForm.addEventListener('submit', function (e) {
              e.preventDefault();
              handleBoardingSubmit();
            });
          }

          var chatInput = document.getElementById('driving-chat-input');
          if (chatInput) {
            chatInput.addEventListener('input', function () {
              state.draft = chatInput.value;
              var cCount = document.getElementById('chat-count');
              if (cCount) cCount.textContent = chatInput.value.length + ' / 800';
            });
            chatInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
                e.preventDefault();
                if (!state.isReplying) handleSendChatMessage();
              }
            });
            var scrollBox = document.getElementById('chat-scroll-box');
            if (scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;
          }

          var chatForm = document.getElementById('driving-chat-form');
          if (chatForm) {
            chatForm.addEventListener('submit', function (e) {
              e.preventDefault();
              handleSendChatMessage();
            });
          }

          var diaryInput = document.getElementById('mind-diary-input');
          if (diaryInput) {
            diaryInput.addEventListener('input', function () {
              state.diaryOneLine = diaryInput.value;
              var dCount = document.getElementById('diary-count');
              if (dCount) dCount.textContent = diaryInput.value.length + ' / 140';
            });
          }

          var diaryForm = document.getElementById('mind-diary-form');
          if (diaryForm) {
            diaryForm.addEventListener('submit', function (e) {
              e.preventDefault();
              handleSaveDiary();
            });
          }
        }

        /* =================================================================
           7. Action Handlers
           ================================================================= */
        function handleBoardingSubmit() {
          var trimmed = state.input.concernText.trim();
          if (!trimmed) {
            state.validationError = '고민 내용을 한 줄이라도 들려주시면 계기판을 점검해 드릴게요.';
            renderApp();
            var ta = document.getElementById('concern-textarea');
            if (ta) ta.focus();
            return;
          }
          if (trimmed.length < 4) {
            state.validationError = '조금만 더 상황을 들려주시면 마음 계기판을 정확히 읽을 수 있어요. (4자 이상)';
            renderApp();
            var ta2 = document.getElementById('concern-textarea');
            if (ta2) ta2.focus();
            return;
          }

          var safety = detectSafetySignal(trimmed);
          if (safety.level !== 'safe') {
            state.safetyBlock = safety;
            state.stage = 1;
            renderApp();
            return;
          }

          state.validationError = null;
          state.safetyBlock = null;
          state.stage = 2;
          state.isAnalyzing = true;
          state.messages = [];
          state.hasArrived = false;
          state.driveSummary = null;
          renderApp();

          setTimeout(function () {
            state.analysis = analyzeConcernLocally(state.input);
            state.isAnalyzing = false;
            renderApp();
          }, 360);
        }

        function handleStartDriving() {
          if (state.messages.length === 0) {
            state.messages = [createInitialDriverGreeting(state.input, state.analysis, state.drivingMode)];
          }
          state.stage = 3;
          triggerCheer('drive_start');
          renderApp();
        }

        function handleSendChatMessage() {
          if (state.isReplying) return;
          var trimmed = state.draft.trim();
          if (!trimmed) {
            state.draftError = '전하고 싶은 말을 한 줄이라도 적어 주세요.';
            renderApp();
            return;
          }
          var safety = detectSafetySignal(trimmed);
          if (safety.level !== 'safe') {
            state.safetyBlock = safety;
            renderApp();
            return;
          }

          var userMsg = {
            id: 'user-' + Date.now(),
            role: 'user',
            text: trimmed,
            mode: state.drivingMode,
            timestampLabel: formatTimeLabel(),
          };
          state.draft = '';
          state.draftError = null;
          state.messages.push(userMsg);
          state.isReplying = true;
          renderApp();

          setTimeout(function () {
            var replyText = generateDriverReplyLocally(
              trimmed,
              state.input,
              state.analysis,
              state.drivingMode,
              state.messages
            );
            state.messages.push({
              id: 'driver-' + Date.now(),
              role: 'driver',
              text: replyText,
              mode: state.drivingMode,
              timestampLabel: formatTimeLabel(),
            });
            state.isReplying = false;
            var userTurnCount = state.messages.filter(function (m) {
              return m.role === 'user';
            }).length;
            if (userTurnCount >= 2) {
              state.driveSummary = summarizeDriveLocally(state.input, state.analysis, state.messages);
            }
            renderApp();
          }, 420);
        }

        function handleSaveDiary() {
          var trimmed = state.diaryOneLine.trim();
          if (!trimmed) {
            state.diaryError = '오늘의 마음을 한 줄로 적어 주세요.';
            state.diarySavedToast = false;
            renderApp();
            return;
          }
          if (trimmed.length < 2) {
            state.diaryError = '두 글자 이상 적어 주시면 마음 일기에 저장할 수 있어요.';
            state.diarySavedToast = false;
            renderApp();
            return;
          }
          var safety = detectSafetySignal(trimmed);
          if (safety.level !== 'safe') {
            state.isDiaryOpen = false;
            state.safetyBlock = safety;
            renderApp();
            return;
          }

          var todayKey = getLocalDateKey();
          state.diaryEntries = upsertMindDiaryEntry(state.diaryEntries, {
            dateKey: todayKey,
            emotion: state.diaryEmotion,
            oneLine: trimmed,
            category: state.input.category,
          });
          saveMindDiaryEntries(state.diaryEntries);
          state.diaryError = null;
          state.diarySavedToast = true;
          triggerCheer('diary_saved');
          renderApp();
        }

        function openDiaryDrawer() {
          var todayKey = getLocalDateKey();
          var todayEntry = state.diaryEntries.find(function (e) {
            return e.dateKey === todayKey;
          });
          state.diaryEmotion = todayEntry ? todayEntry.emotion : state.input.emotion;
          state.diaryOneLine = todayEntry ? todayEntry.oneLine : '';
          state.diaryError = null;
          state.diarySavedToast = false;
          state.isDiaryOpen = true;
          renderApp();
          var inp = document.getElementById('mind-diary-input');
          if (inp) inp.focus();
        }

        function resetToNewRide() {
          state.stage = 1;
          state.input.concernText = '';
          state.validationError = null;
          state.safetyBlock = null;
          state.analysis = null;
          state.messages = [];
          state.hasArrived = false;
          state.driveSummary = null;
          state.draft = '';
          state.draftError = null;
          renderApp();
        }

        document.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-action]');
          if (!btn) return;
          var action = btn.getAttribute('data-action');

          if (action === 'font-scale') {
            state.fontScale = btn.getAttribute('data-scale') || 'normal';
            renderApp();
          } else if (action === 'reset-home' || action === 'start-new-ride') {
            resetToNewRide();
          } else if (action === 'clear-safety') {
            state.safetyBlock = null;
            renderApp();
          } else if (action === 'nav-stage') {
            var targetStage = Number(btn.getAttribute('data-stage'));
            if (targetStage === 5) {
              openDiaryDrawer();
            } else if (targetStage === 1) {
              state.safetyBlock = null;
              state.stage = 1;
              renderApp();
            } else if (targetStage === 2 && state.analysis) {
              state.stage = 2;
              renderApp();
            } else if (targetStage === 3 && (state.messages.length > 0 || state.analysis)) {
              handleStartDriving();
            } else if (targetStage === 4 && state.hasArrived) {
              state.stage = 4;
              renderApp();
            }
          } else if (action === 'select-driver') {
            state.input.driverId = btn.getAttribute('data-driver-id') || 'veteran';
            renderApp();
          } else if (action === 'select-category') {
            state.input.category = btn.getAttribute('data-category') || '친구 관계';
            renderApp();
          } else if (action === 'select-emotion') {
            state.input.emotion = btn.getAttribute('data-emotion') || '서운함';
            renderApp();
          } else if (action === 'select-sample') {
            var sid = btn.getAttribute('data-sample-id');
            var sample = SAMPLE_CONCERNS.find(function (s) {
              return s.id === sid;
            });
            if (sample) {
              state.input.category = sample.category;
              state.input.emotion = sample.emotion;
              state.input.intensity = sample.intensity;
              state.input.concernText = sample.concernText;
              state.validationError = null;
              state.safetyBlock = null;
              renderApp();
            }
          } else if (action === 'back-boarding') {
            state.stage = 1;
            renderApp();
          } else if (action === 'retry-analyze') {
            handleBoardingSubmit();
          } else if (action === 'start-driving') {
            handleStartDriving();
          } else if (action === 'back-dashboard') {
            state.stage = 2;
            renderApp();
          } else if (action === 'change-mode') {
            state.drivingMode = btn.getAttribute('data-mode') || 'listen';
            renderApp();
          } else if (action === 'use-starter') {
            state.draft = btn.getAttribute('data-prompt') || '';
            state.draftError = null;
            renderApp();
            var ci = document.getElementById('driving-chat-input');
            if (ci) ci.focus();
          } else if (action === 'refresh-summary') {
            state.driveSummary = summarizeDriveLocally(state.input, state.analysis, state.messages);
            renderApp();
          } else if (action === 'arrive') {
            state.hasArrived = true;
            state.stage = 4;
            renderApp();
          } else if (action === 'back-driving') {
            state.stage = 3;
            renderApp();
          } else if (action === 'open-diary') {
            openDiaryDrawer();
          } else if (action === 'close-diary') {
            state.isDiaryOpen = false;
            renderApp();
          } else if (action === 'diary-emotion') {
            state.diaryEmotion = btn.getAttribute('data-emotion') || '서운함';
            state.diarySavedToast = false;
            renderApp();
          } else if (action === 'delete-diary') {
            var dk = btn.getAttribute('data-date-key');
            state.diaryEntries = removeMindDiaryEntry(state.diaryEntries, dk);
            saveMindDiaryEntries(state.diaryEntries);
            renderApp();
          } else if (action === 'dismiss-cheer') {
            state.activeCheer = null;
            renderApp();
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.isDiaryOpen) {
            state.isDiaryOpen = false;
            renderApp();
          }
        });

        renderApp();
      })();
    </script>
  </body>
</html>
